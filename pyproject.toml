[project]
name = "dayamlchecker"
version = "1.7.0"
description = "An LSP for Docassemble YAML interviews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "esprima>=4.0.1",
    "mako>=1.3.10",
    "jinja2>=3.1.6",
    "black>=24.0.0",
    "ruamel.yaml>=0.18.0",
    "docx2python>=3.5.0",
    "linkify-it-py>=2.0.3",
    "pypdf>=5.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "spylls>=0.1.7,<0.2",
]
# The bundled Spanish dictionary (data/dictionaries/es) is MPL 1.1.
license = "MIT AND MPL-1.1"
license-files = [
    "LICEN[CS]E*",
    "src/dayamlchecker/data/dictionaries/es/LICENSE.md",
    "src/dayamlchecker/data/dictionaries/es/MPL-1.1.txt",
]
authors = [
  { name="Bryce Willey", email="bryce.steven.willey@gmail.com" },
  { name="Quinten Steenhuis", email="qsteenhuis@suffolk.edu" },
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
dayamlchecker = ["py.typed", "data/*.yml", "data/*.txt", "data/dictionaries/es/*"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project.scripts]
dayamlchecker = "dayamlchecker.yaml_structure:main"
dayamlchecker-fmt = "dayamlchecker.code_formatter:main"

[tool.mypy]
mypy_path = "src"
exclude = ["^build/"]
explicit_package_bases = true
